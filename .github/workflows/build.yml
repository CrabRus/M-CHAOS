name: Build LaTeX Document

on:
  push:
    branches: [ "main", "predbeznaVerzia" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: clanok.tex
          # latexmk используется по умолчанию. Он сам 4 раза прогонит pdflatex и bibtex, 
          # чтобы оглавление и литература собрались корректно.

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zostaveny-Clanok-PDF
          path: clanok.pdf